# Сайт (GitHub Pages): статическая страница из site/ — kpanics.github.io/games
# Публикуется при изменениях site/ в main (и вручную). PR сайт не трогают.
name: Сайт (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Настроить Pages (и включить, если ещё выключен)
      uses: actions/configure-pages@v5
      with:
        enablement: true

    - name: Загрузить сайт (site/)
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

    - name: Опубликовать
      id: deployment
      uses: actions/deploy-pages@v4
