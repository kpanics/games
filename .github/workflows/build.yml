name: Build Cursed Recode

# Сборка идёт штатным путём проекта (см. Cursed-Recode-main/README.md):
#   python tools\setup-libs.py  -> libs\ (jar игры, библиотеки Minecraft, Fabric Loader, Fabric API)
#   build.cmd                   -> tools\aw.cmd (access widener) + javac --release 25 + jar
#   cargo build --release       -> нативный движок (CursedRecode.exe, cursed_twin.exe, cursed_recode.dll)
#
# Почему именно так, а не Gradle/javac «руками»:
#   * libs\ в git не лежит (.gitignore) - без setup-libs.py компилятор не видит ни Minecraft, ни Fabric;
#   * build.cmd сам накладывает access widener, без него приватные поля игры не компилируются;
#   * build.cmd вызывает javac --release 25, а fabric.mod.json требует java >= 25 - JDK 21 не подойдёт.
#
# Джоба dist (push в main) собирает ещё и дистрибутив «на GitHub» (dist/README.md): подписанный манифест,
# start.json и файлы билда публикуются в Release с тегом `dist`, после чего тот же лоадер проверяется
# в headless-режиме - скачивает всё с GitHub и сверяет хеши.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Дистрибутив «на GitHub»: база для лоадера и публичная половина ключа подписи манифеста
  # (приватная - секрет CURSED_DIST_KEY; пара см. dist/README.md)
  DIST_BASE: https://github.com/kpanics/games/releases/download/dist
  DIST_PUB: 553f8e75906c6f2cee9b76f2243625ece155f07b10a8a9779af58356b061db2c

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    # все run-шаги по умолчанию выполняются в папке проекта и в cmd
    defaults:
      run:
        shell: cmd
        working-directory: Cursed-Recode-main

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Cache Rust build
      uses: actions/cache@v4
      with:
        path: |
          Cursed-Recode-main/native/target
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cursed-Recode-main/native/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Setup Java 25
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Toolchain versions
      run: |
        java -version
        javac -version
        python --version
        cargo --version

    - name: Fetch libraries (libs\)
      run: python tools\setup-libs.py

    - name: Build Java mod (aw + javac + jar)
      run: call build.cmd

    - name: Build Rust native
      run: cargo build --release
      working-directory: Cursed-Recode-main/native
      env:
        CURSED_VERIFY_API: ${{ env.DIST_BASE }}
        CURSED_VERIFY_KEY: ${{ env.DIST_PUB }}

    - name: Collect artifacts
      run: |
        if not exist dist mkdir dist
        for %%f in (build\cursed-recode-*.jar native\target\release\*.exe native\target\release\*.dll) do copy /y "%%f" dist\ >nul
        dir dist

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cursed-Recode-windows-x64
        if-no-files-found: error
        path: Cursed-Recode-main/dist/*

  # Логи упавшего запуска - в Issue: их можно прочитать и снаружи (run-логи отдаются только раннеру).
  # Отдельной джобой, потому что лог появляется только после завершения упавшей.
  diagnostics:
    needs: build
    if: always() && needs.build.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
    - name: Logs to an issue
      run: |
        JOB_ID=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name=="build") | .id' | head -1)
        gh run view --job "$JOB_ID" --log > diag.log 2> view.err || true
        [ -s diag.log ] || curl -sL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GH_REPO/actions/jobs/$JOB_ID/logs" -o diag.log
        { echo '\`\`\`'; cat view.err 2>/dev/null; echo '\`\`\`'; echo; tail -c 55000 diag.log; } > diag.md
        gh issue create --title "CI logs: run $RUN_ID (build)" --body-file diag.md || true
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}

  # Дистрибутив «на GitHub»: только push в main. Собирает билд с вшитой базой и ключом,
  # публикует Release (тег dist) и проверяет связку headless-запуском лоадера.
  dist:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: cmd
        working-directory: Cursed-Recode-main

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Cache Rust build
      uses: actions/cache@v4
      with:
        path: |
          Cursed-Recode-main/native/target
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-dist-cargo-${{ hashFiles('Cursed-Recode-main/native/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-dist-cargo-

    - name: Setup Java 25
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Fetch libraries (libs\)
      run: python tools\setup-libs.py

    - name: Build Java mod (aw + javac + jar)
      run: call build.cmd

    - name: Build Rust native (с вшитой базой GitHub и ключом)
      run: cargo build --release
      working-directory: Cursed-Recode-main/native
      env:
        CURSED_VERIFY_API: ${{ env.DIST_BASE }}
        CURSED_VERIFY_KEY: ${{ env.DIST_PUB }}

    - name: Assemble the build (dist-home)
      run: |
        rem --- бинаря движка в bin\, сам лоадер в loader\
        if not exist ..\dist-home\bin mkdir ..\dist-home\bin
        if not exist ..\dist-home\loader mkdir ..\dist-home\loader
        copy /y native\target\release\CursedRecode.exe ..\dist-home\bin\ >nul
        copy /y native\target\release\cursed_twin.exe ..\dist-home\bin\ >nul
        copy /y native\target\release\cursed_recode.dll ..\dist-home\bin\ >nul
        copy /y native\target\release\recode_loader.exe ..\dist-home\loader\ >nul
        rem --- игра (jar с access widener) и мод
        if not exist ..\dist-home\game mkdir ..\dist-home\game
        copy /y libs\minecraft\minecraft-26.3.jar ..\dist-home\game\ >nul
        copy /y build\cursed-recode-*.jar ..\dist-home\game\ >nul
        rem --- библиотеки: fabric, mc, fabric-api
        xcopy /e /i /y libs\fabric ..\dist-home\libraries\fabric\ >nul
        xcopy /e /i /y libs\mc ..\dist-home\libraries\mc\ >nul
        xcopy /e /i /y libs\fabric-api ..\dist-home\libraries\fabric-api\ >nul
        rem --- log4j конфиг
        copy /y tools\log4j2-dev.xml ..\dist-home\log4j2.xml >nul
        dir /s /b ..\dist-home | find /c /v ""

    - name: Pack the runtime (runtime.zip из JDK раннера)
      run: |
        powershell -NoProfile -Command "Compress-Archive -Path \"$env:JAVA_HOME\*\" -DestinationPath ..\dist-home\runtime.zip -Force"
        powershell -NoProfile -Command "[math]::Round((Get-Item ..\dist-home\runtime.zip).Length / 1MB)"

    - name: Make the dist (манифест + подпись + start.json + object-*)
      run: |
        pip install --quiet cryptography
        python ..\dist\make_dist.py --home ..\dist-home --out ..\dist-out --key %CURSED_DIST_KEY% --build %GITHUB_RUN_NUMBER% --version 0.1.0 --notes "Сборка CI" --fetch-assets 26.3
      env:
        CURSED_DIST_KEY: ${{ secrets.CURSED_DIST_KEY }}

    - name: Publish (gh release create, тег dist)
      run: |
        rem лоадер ещё и под собственным именем: его скачивают из релиза руками,
        rem безымянный object-sha256 игрок не отличит от сотни таких же
        copy /y ..\dist-home\loader\recode_loader.exe ..\dist-out\recode_loader.exe >nul
        gh release view dist >nul 2>nul && gh release delete dist --cleanup-tag --yes
        gh release create dist ..\dist-out\* --title "Cursed Recode" --notes "Дистрибутив «на GitHub»: start.json + файлы билда (object-sha256). Лоадер - loader/recode_loader.exe." --latest
      env:
        GH_TOKEN: ${{ github.token }}

    - name: The linkage test (лоадер скачивает весь билд с GitHub)
      run: |
        set CURSED_LOADER_HOME=%CD%\..\test-home
        mkdir ..\test-home 2>nul
        native\target\release\recode_loader.exe --headless --token github --sync
      env:
        GH_TOKEN: ${{ github.token }}

  # Логи упавшей dist - туда же, в Issue
  diagnostics-dist:
    needs: dist
    if: always() && needs.dist.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
    - name: Logs to an issue
      run: |
        JOB_ID=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name=="dist") | .id' | head -1)
        gh run view --job "$JOB_ID" --log > diag.log 2> view.err || true
        [ -s diag.log ] || curl -sL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GH_REPO/actions/jobs/$JOB_ID/logs" -o diag.log
        { echo '\`\`\`'; cat view.err 2>/dev/null; echo '\`\`\`'; echo; tail -c 55000 diag.log; } > diag.md
        gh issue create --title "CI logs: run $RUN_ID (dist)" --body-file diag.md || true
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}

  # Linux (CachyOS и прочие, docs/CACHYOS.md): нативный синк-лоадер (linux-loader/) и живой тест -
  # он качает весь дистрибутив с GitHub и ассеты Mojang на ubuntu-раннере, как это сделает игрок.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          linux-loader/target
          ~/.cargo/registry
        key: ${{ runner.os }}-linux-loader-${{ hashFiles('linux-loader/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-linux-loader-

    - name: Build
      run: cargo build --release --manifest-path linux-loader/Cargo.toml

    - name: The Linux sync test (весь дистрибутив с GitHub + ассеты Mojang)
      timeout-minutes: 30
      run: |
        mkdir -p "$HOME/test-home"
        linux-loader/target/release/cursed-linux-loader --home "$HOME/test-home" --sync-only
        du -sh "$HOME/test-home"
        test -f "$HOME/test-home/bin/CursedRecode.exe" || { echo "нет бинарей"; exit 1; }
        test -d "$HOME/test-home/runtime/bin" || { echo "runtime не распакован"; exit 1; }
        ls "$HOME/test-home/game" | head -3
        echo "Linux-синк живой: подпись, билд, ассеты и распаковка - всё сошлось"

  diagnostics-linux:
    needs: linux
    if: always() && needs.linux.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
    - name: Logs to an issue
      run: |
        JOB_ID=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name=="linux") | .id' | head -1)
        gh run view --job "$JOB_ID" --log > diag.log 2> view.err || true
        [ -s diag.log ] || curl -sL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GH_REPO/actions/jobs/$JOB_ID/logs" -o diag.log
        { echo '```'; cat view.err 2>/dev/null; echo '```'; echo; tail -c 55000 diag.log; } > diag.md
        gh issue create --title "CI logs: run $RUN_ID (linux)" --body-file diag.md || true
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
