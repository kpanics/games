[package]
name = "cursed-linux-loader"
version = "0.4.1"
edition = "2021"
publish = false

# Нативная половина лоадера Cursed Recode на Linux (docs/CACHYOS.md): подпись манифеста, синк,
# распаковка runtime, запуск игры (bin/CursedRecode.exe и Windows-JDK) через Wine - и окно лоадера
# (cursed-recode-gui) с вкладками, новостями и аккаунтами (API cursedclient.xyz, соседний репо
# recode-site-and-backend). Шрифты - Geist, растеризация FreeType (хинтинг; fontdue путал
# регистры кириллицы на кривых сегментах cmap формата 4).
[dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
sha1 = "0.10"
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
winit = "0.30"
softbuffer = "0.4"
freetype-rs = "0.38"

[lib]
name = "cursed_linux_loader"
path = "src/lib.rs"

# CLI: то же, что было (headless синк/запуск)
[[bin]]
name = "cursed-linux-loader"
path = "src/bin/loader.rs"

# GUI-лоадер: окно с вкладками
[[bin]]
name = "cursed-recode-gui"
path = "src/bin/gui.rs"

[profile.release]
lto = "thin"
