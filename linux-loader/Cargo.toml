[package]
name = "cursed-linux-loader"
version = "0.1.0"
edition = "2021"
publish = false

# Нативная половина лоадера Cursed Recode на Linux (docs/CACHYOS.md): подпись манифеста, синк,
# распаковка runtime. Ни одного Win32-вызова; скачивание - системным curl (TLS и редиректы - не наше).
[dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
sha1 = "0.10"
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
