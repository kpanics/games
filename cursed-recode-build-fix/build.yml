name: Build Cursed Recode

# Сборка идёт штатным путём проекта (см. Cursed-Recode-main/README.md):
#   python tools\setup-libs.py  -> libs\ (jar игры, библиотеки Minecraft, Fabric Loader, Fabric API)
#   build.cmd                   -> tools\aw.cmd (access widener) + javac --release 25 + jar
#   cargo build --release       -> нативный движок (CursedRecode.exe, cursed_twin.exe, cursed_recode.dll)
#
# Почему именно так, а не Gradle/javac «руками»:
#   * libs\ в git не лежит (.gitignore) - без setup-libs.py компилятор не видит ни Minecraft, ни Fabric;
#   * build.cmd сам накладывает access widener, без него приватные поля игры не компилируются;
#   * build.cmd вызывает javac --release 25, а fabric.mod.json требует java >= 25 - JDK 21 не подойдёт.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # все run-шаги по умолчанию выполняются в папке проекта и в cmd
    defaults:
      run:
        shell: cmd
        working-directory: Cursed-Recode-main

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Cache Rust build
      uses: actions/cache@v4
      with:
        path: |
          Cursed-Recode-main/native/target
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cursed-Recode-main/native/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Setup Java 25
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Toolchain versions
      run: |
        java -version
        javac -version
        python --version
        cargo --version

    - name: Fetch libraries (libs\)
      run: python tools\setup-libs.py

    - name: Build Java mod (aw + javac + jar)
      run: call build.cmd

    - name: Build Rust native
      run: cargo build --release
      working-directory: Cursed-Recode-main/native

    - name: Collect artifacts
      run: |
        if not exist dist mkdir dist
        for %%f in (build\cursed-recode-*.jar native\target\release\*.exe native\target\release\*.dll) do copy /y "%%f" dist\ >nul
        dir dist

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cursed-Recode-windows-x64
        if-no-files-found: error
        path: Cursed-Recode-main/dist/*
