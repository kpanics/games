# How often the accounts may be asked, per address: the doors (sign-in, registration, loader tokens, a new password)
# rarely, the rest more freely. Over the limit: 429.
limit_req_zone $binary_remote_addr zone=cursed_doors:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=cursed_api:10m rate=10r/s;
# The loader downloading the client: thousands of files on a first install.
limit_req_zone $binary_remote_addr zone=cursed_dist:10m rate=300r/s;
limit_conn_zone $binary_remote_addr zone=cursed_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# The loader asks for ~4900 files on a first install over one HTTP/2 connection: without this nginx closes it every
# 1000 requests, and requests caught in flight fail (01.10, a tester stopped at 94%).
keepalive_requests 100000;
